version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /hosting
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      hosted-service:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
