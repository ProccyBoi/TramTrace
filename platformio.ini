[platformio]
default_envs = tramtrace

[env:tramtrace]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Use scripts/upload_firmware_only.ps1 for routine uploads so NVS is untouched.
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^6.21.5
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=1
    -D DEFAULT_API_URL=\"https://tramtrace-sydney-live.chatgptbolt.chatgpt.site\"

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=c++17
    -I include
