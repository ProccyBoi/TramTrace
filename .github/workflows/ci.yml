name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
      - name: Install firmware and backend tooling
        run: python -m pip install platformio==6.1.19 pytest -r server/requirements.txt
      - name: Test backend and release tooling
        run: python -m pytest tests -q
      - name: Test native firmware policy
        run: pio test -e native
      - name: Build ESP32 firmware
        run: pio run -e tramtrace
      - name: Enable pnpm
        run: corepack enable
      - name: Install hosted service dependencies
        working-directory: hosting
        run: pnpm install --frozen-lockfile
      - name: Audit hosted service dependencies
        working-directory: hosting
        run: pnpm audit --audit-level high
      - name: Lint hosted service
        working-directory: hosting
        run: pnpm lint
      - name: Test hosted service
        working-directory: hosting
        run: pnpm test
