name: Firmware release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify release provenance
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install release tooling
        run: python -m pip install platformio==6.1.19 pytest
      - name: Test release tooling and native firmware policy
        run: |
          python -m pytest tests/release -q
          pio test -e native
      - name: Build firmware
        run: pio run -e tramtrace
      - name: Create signed release assets
        env:
          OTA_SIGNING_KEY_B64: ${{ secrets.OTA_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$OTA_SIGNING_KEY_B64"
          signing_key="$RUNNER_TEMP/ota-signing-key.pem"
          trap 'rm -f "$signing_key"' EXIT
          printf '%s' "$OTA_SIGNING_KEY_B64" | base64 --decode > "$signing_key"
          chmod 600 "$signing_key"
          python scripts/create_ota_release.py \
            --firmware .pio/build/tramtrace/firmware.bin \
            --tag "$GITHUB_REF_NAME" \
            --signing-key "$signing_key" \
            --output release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            release/manifest.json "release/tramtrace-$version.bin" \
            --verify-tag \
            --title "TramTrace firmware $version" \
            --notes "Signed production firmware for TramTrace ESP32 boards."
